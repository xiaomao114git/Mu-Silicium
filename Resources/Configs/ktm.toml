#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header = true
# Where BootShim copies an "XNUP" container appended after the UEFI image.
# 0xF0000000..0xF3800000 is free here (trust_ui_vm_region starts at 0xF3800000).
payload_base = 0xF0000000

#
# UEFI FD Configs
#
[uefi_fd]
base = 0xA7100000
size = 0x400000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = true

#
# Android Boot Image Configs
#
[boot_image]
header_version = 4
